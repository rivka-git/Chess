services:

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: chess
      POSTGRES_PASSWORD: chess
      POSTGRES_DB: chess
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chess"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api_gateway:
    build:
      context: .
      dockerfile: api_gateway/Dockerfile
    ports:
      - "8081:8080"
    environment:
      DATABASE_URL: postgresql://chess:chess@postgres:5432/chess
    depends_on:
      postgres:
        condition: service_healthy
    restart: on-failure

  ws_gateway:
    build:
      context: .
      dockerfile: ws_gateway/Dockerfile
    ports:
      - "8082:8765"
      - "8766:8766"
    environment:
      DATABASE_URL: postgresql://chess:chess@postgres:5432/chess
      REDIS_URL: redis://redis:6379
      HEALTH_PORT: 8766
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8766/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: on-failure

volumes:
  postgres_data:
